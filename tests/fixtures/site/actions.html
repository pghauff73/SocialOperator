<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Action Postcondition Fixture</title>
    <style>
      body { font: 18px/1.5 sans-serif; margin: 2rem; min-height: 2200px; }
      main { display: grid; gap: 0.75rem; max-width: 32rem; }
      button, a { font: inherit; padding: 0.6rem 1rem; width: max-content; }
      #moving-target { position: relative; }
      #scroll-result { margin-top: 1200px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Action postcondition fixture</h1>
      <a href="project.html">Navigate to project</a>
      <button id="popup" type="button">Open project popup</button>
      <a href="synthetic.txt" download="synthetic.txt">Download synthetic file</a>
      <button id="next-page" type="button">Next page</button>
      <p id="page-indicator">Page 1 of 2</p>
      <p id="page-item">Synthetic profile page one</p>
      <button id="scroll" type="button">Scroll down</button>
      <button id="moving-target" type="button">Moving target</button>
      <button id="noop" type="button">No-op action</button>
      <a href="https://example.invalid/outside">Outside policy link</a>
      <p id="click-result" hidden>Moving target was clicked.</p>
      <p id="scroll-result">Scroll destination</p>
    </main>
    <script>
      document.querySelector("#popup").addEventListener("click", () => {
        window.open("project.html?popup=1", "synthetic-project-popup", "width=640,height=480");
      });
      document.querySelector("#scroll").addEventListener("click", () => {
        document.querySelector("#scroll-result").scrollIntoView();
      });
      document.querySelector("#next-page").addEventListener("click", () => {
        document.querySelector("#page-indicator").innerText = "Page 2 of 2";
        document.querySelector("#page-item").innerText = "Synthetic profile page two";
      });
      const moving = document.querySelector("#moving-target");
      moving.addEventListener("mouseenter", () => {
        moving.style.transform = "translateX(280px)";
      }, {once: true});
      moving.addEventListener("click", () => {
        document.querySelector("#click-result").hidden = false;
      });
    </script>
  </body>
</html>
